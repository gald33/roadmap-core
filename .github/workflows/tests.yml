name: Tests

# Two jobs, because the package makes two different claims and one environment
# cannot prove both.
#
# `isolation` proves the LIBRARY stands alone: it installs `[dev]` and asserts
# that app, fastapi, sqlalchemy and yaml are all absent, because the store, the
# graph and the impact rule must work with nothing installed.
#
# `adoption` proves the TOOL is usable, which needs `[files]` — authoring an
# item is writing YAML, so `push` cannot work without a parser.
#
# Putting PyYAML in `[dev]` would let one job serve both, by disabling the guard
# that makes the first claim mean anything. That is the trade it exists to
# refuse. These jobs came from Lucille's `roadmap-core-tests.yml`; the package
# has since moved to its own repository, so the path filters and the `cd` into a
# subdirectory are gone, but what they check is unchanged.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install roadmap-core only
        run: pip install -e '.[dev]'

      - name: Assert the isolation is real
        # Guards the guard. If a future change makes any of these importable,
        # every test below would still pass while proving nothing.
        run: |
          python - <<'PY'
          import sys
          for mod in ("app", "fastapi", "sqlalchemy", "yaml"):
              try:
                  __import__(mod)
              except ImportError:
                  continue
              sys.exit(
                  f"{mod!r} is importable in the isolation job, so this job no "
                  "longer proves the package stands alone. Either remove the "
                  "dependency that pulled it in, or delete this job and stop "
                  "claiming the package is standalone."
              )
          print("isolation confirmed: none of app/fastapi/sqlalchemy/yaml importable")
          PY

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Test
        run: pytest -q tests/

  adoption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install what an adopter installs
        run: pip install -e '.[files,dev]'

      - name: Nothing from a backend may be underneath this
        # This job installs more than the isolation job, so it needs its own
        # version of the same guard rather than inheriting one.
        run: |
          python - <<'PY'
          import sys
          for mod in ("app", "fastapi", "sqlalchemy"):
              try:
                  __import__(mod)
              except ImportError:
                  continue
              sys.exit(f"{mod!r} is importable, so this proves nothing about adoption")
          print("confirmed: adopting needs no backend")
          PY

      - name: Stand the roadmap up in a scratch project
        # `-rs` plus the skip check because a test that skips reports success,
        # and a job that only checks the exit code cannot tell "4 passed" from
        # "4 skipped".
        run: |
          set -o pipefail
          pytest -q -rs tests/test_adoption.py | tee out.txt
          if grep -qE '[0-9]+ skipped' out.txt; then
            echo "::error title=adoption::the adoption test skipped — it proved nothing"
            exit 1
          fi
