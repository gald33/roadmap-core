# roadmap serve on a shared VM: the server, and a Caddy sidecar that owns TLS.
# Standalone by design — its own project name, network and volumes — so it
# shares the machine with other stacks but not their compose files or ingress.
#
#   cp deploy/vm/.env.example deploy/vm/.env   # then fill it in
#   docker compose -f deploy/vm/docker-compose.yml up -d --build
name: roadmap

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  roadmap:
    build:
      context: ../..
      dockerfile: deploy/vm/Dockerfile
    restart: unless-stopped
    volumes:
      - roadmap-data:/data
    # nothing is published: only the sidecar on this network reaches :8765
    networks: [roadmap]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  caddy:
    build: ./caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ORIGIN_PORT:-8445}:${ORIGIN_PORT:-8445}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [roadmap]
    networks: [roadmap]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  roadmap: {}

volumes:
  roadmap-data: {}
  caddy-data: {}
  caddy-config: {}
